<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Power in the West: an explorable map</title>
<meta name="description" content="An interactive, SimCity-style map of where electricity in eight western states comes from and where it goes: power plants, fuel, transmission lines, users and emissions, built from public data.">

<meta name="theme-color" content="#2b2430">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../west/west.css?v=6">
<link rel="stylesheet" href="power.css?v=1">
</head>
<body>
<div id="app">
  <canvas id="map" tabindex="0" aria-label="Interactive map of a state's electricity system. Use the Places list in the side panel to browse the same information without the map."></canvas>

  <header id="hud">
    <div class="plate title">
      <a id="navWest" href="?s=west" hidden>&#9666; The West</a>
      <h1>Arizona Power</h1>
      <p>Where it comes from. Where it goes.</p>
    </div>
    <div class="plate stats" id="hudstats"></div>
  </header>

  <nav id="layers" class="plate" aria-label="Map layers">
    <button id="layersToggle" class="mini" aria-expanded="true">Layers</button>
    <div id="layerList"></div>
    <div class="season" role="group" aria-label="Time of day">
      <button data-season="summer" class="on">Day</button><button data-season="winter">Night</button>
    </div>
  </nav>

  <div id="zoom" class="plate">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">&minus;</button>
    <button id="zhome" aria-label="Show all of Arizona" title="Show all of Arizona">&#9633;</button>
    <button id="zfull" aria-label="Open the map full screen in a new tab" title="Open full screen" hidden>&#10530;</button>
  </div>

  <aside id="panel" class="plate" aria-live="polite">
    <button id="panelHandle" aria-label="Expand or collapse panel"></button>
    <div id="panelBody"></div>
  </aside>

  <div id="tour" class="plate" hidden>
    <div id="tourText"></div>
    <div class="tourNav">
      <button id="tourPrev">&larr; Back</button>
      <span id="tourDots"></span>
      <button id="tourNext" class="primary">Next &rarr;</button>
      <button id="tourExit" class="mini" aria-label="Exit tour">&times;</button>
    </div>
  </div>
  <button id="tourStart" class="plate primary">&#9654; Take the 2-minute tour</button>

  <div id="legend" class="plate" hidden></div>
  <div id="scale"><span id="scaleBar"></span><span id="scaleTxt"></span></div>
  <div id="tip" hidden></div>
  <div id="loading">Loading map&hellip;</div>
</div>
<script>
/* Same map engine as the water maps; this page loads the electricity data and content. ?s=az picks the region. */
(() => {
  const W = ['co', 'ca', 'nm', 'ut', 'id', 'mt', 'nv'], REG = {
    west: ['../west/data/west.js', '../west/content/west.js', 'data/west.js', 'content/kit.js', 'content/west.js'],
    az: ['../data.js', '../content.js', 'data/az.js', 'content/kit.js', 'content/az.js'] };
  W.forEach(s => REG[s] = ['../west/data/' + s + '.js', '../west/content/' + s + '.js', 'data/' + s + '.js', 'content/kit.js', 'content/' + s + '.js']);
  const id = (new URLSearchParams(location.search).get('s') || 'west').toLowerCase();
  // a state links back to the overview (the overview has no link back, like the water map's)
  const nav = document.getElementById('navWest');
  nav.href = '?s=west'; nav.innerHTML = '&#9666; The West';
  // the button to the same place on the water map, at the top of the side panel; the water map has the mirror image
  const NAMES = { az: 'Arizona', ca: 'California', co: 'Colorado', id: 'Idaho', mt: 'Montana', nv: 'Nevada', nm: 'New Mexico', ut: 'Utah' };
  const water = NAMES[id] ? ['../?s=' + id, NAMES[id] + '\'s water map'] : ['../', 'Water map of the West'];
  const mapLink = () => { if (window.MAPCONTENT) window.MAPCONTENT.homeTop = `<a class="btn maplink towater" href="${water[0]}"><span>${water[1]} &rarr;</span><small>Rivers, dams, canals, farms and groundwater</small></a>`; };
  const files = (REG[id] || REG.west).concat(['../west/js/terrain.js', '../west/js/app.js']);
  const V = '6';
  (function next(i) { if (i >= files.length) return; if (files[i] === '../west/js/app.js') mapLink(); const s = document.createElement('script'); s.src = files[i] + '?v=' + V; s.onload = () => next(i + 1); s.onerror = () => { document.getElementById('loading').textContent = 'Could not load the map.'; }; document.body.appendChild(s); })(0);
})();
</script>

</body>
</html>
